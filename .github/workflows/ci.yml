name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Phase 2 tests
        run: npm run test:phase2

      - name: Phase 3 tests
        run: node --no-warnings --experimental-strip-types --test tests/phase-3/*.test.ts

      - name: Phase 4 tests
        run: node --no-warnings --experimental-strip-types --test tests/phase-4/*.test.ts

      - name: Build
        run: npm run build
